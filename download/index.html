<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>WSH Network - Download</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/main.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 8px;
            -webkit-user-select: none;
            /* Safari */
            -moz-user-select: none;
            /* Firefox */
            -ms-user-select: none;
            /* IE10+/Edge */
            user-select: none;
            /* Standard */
        }

        .container {
            max-width: 500px;
            width: 100%;
            padding: 20px 20px;
            border-radius: 25px;
            z-index: 1;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            box-shadow: rgba(30, 30, 30, 0.5) 0px 4px 30px;
        }


        .download-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .download-header img {
            width: 100px;
            margin-bottom: 20px;
        }

        .download-header h1 {
            margin: 0 0 10px 0;
        }

        .download-header p {
            color: #888;
            font-size: 14px;
            margin: 0;
        }

        .download-buttons {
            display: flex;
            flex-direction: row;
            gap: 15px;
            margin-bottom: 10px;
            height: 80px;
            justify-content: center;
            align-items: center;
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            background: #DADADA;
            color: black;
            text-decoration: none;
            border-radius: 20px;
            font-weight: 600;
            transition: background 0.3s;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            width: 50%;
        }



        .download-btn:hover {
            background: white;
            color: black;
        }

        .download-btn>div,
        .coming-soon>div {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            flex-grow: 1;
            gap: 2px;
        }

        .download-btn>div span:first-child,
        .coming-soon>div span:first-child {
            font-size: 0.75rem;
            font-weight: 400;
            opacity: 0.7;
        }

        .download-btn>div span:last-child,
        .coming-soon>div span:last-child {
            font-size: 1rem;
            font-weight: 600;
        }

        .coming-soon {
            border: 1px solid #EEE;
            border-radius: 20px;
            text-align: center;
            display: flex;
            align-items: center;
            align-self: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            margin: 0 auto;
        }

        .coming-soon h2 {
            color: #EEE;
            margin-top: 0;
        }

        .coming-soon p {
            margin-bottom: 0;
        }


        @keyframes rotate {
            0% {
                transform: translate(-50%, -50%) rotate(360deg) translateY(0) translateX(0) scale(1);
            }

            50% {
                transform: translate(-50%, -50%) rotate(180deg) translateY(-20px) translateX(-40px) scale(1.25);
            }

            100% {
                transform: translate(-50%, -50%) rotate(0deg) translateY(0) translateX(0) scale(1);
            }
        }

        @media (max-width: 400px) {
            .download-btn {
                padding: 8px;
                gap: 3px;
            }

            .coming-soon {
                padding: 8px;
                gap: 3px;
                width: fit-content;
            }

            .download-buttons {
                gap: 10px;
            }

            .container {
                padding: 10px;
            }
        }

        .animated-background {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.5;
            z-index: 0;
            pointer-events: none;
            animation: rotate 60s linear infinite;

            /* Smooth rendering */
            image-rendering: -webkit-optimize-contrast;
            image-rendering: smooth;
            backface-visibility: hidden;
            transform-style: preserve-3d;
            will-change: transform;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>

    <script>
        (function createAnimatedBackground() {
            const bgLogo = document.createElement('img');
            bgLogo.src = '/assets/img/wsh-white-2.svg';
            bgLogo.className = 'animated-background';

            // Calculate size: 2x viewport height, maintain aspect ratio
            const logoHeight = window.innerHeight * 2;
            bgLogo.style.height = logoHeight + 'px';
            bgLogo.style.width = logoHeight + 'px'; // Make it square for perfect centering

            // Insert at the beginning of body
            document.body.insertBefore(bgLogo, document.body.firstChild);

            // Update size on window resize
            window.addEventListener('resize', function () {
                const newLogoHeight = window.innerHeight * 2;
                bgLogo.style.height = newLogoHeight + 'px';
                bgLogo.style.width = newLogoHeight + 'px'; // Keep it square
            });
        })();

        // Device detection and auto-redirect
        function detectDevice() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;

            // iOS detection
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                return 'ios';
            }

            // Android detection
            if (/android/i.test(userAgent)) {
                return 'android';
            }

            return 'other';
        }

        // App store links
