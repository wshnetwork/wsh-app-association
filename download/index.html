<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>WSH Network - Download</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/main.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 500px;
            width: 100%;
            padding: 40px 20px;
        }

        .download-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .download-header img {
            width: 100px;
            margin-bottom: 20px;
        }

        .download-header h1 {
            margin: 0 0 10px 0;
        }

        .download-header p {
            color: #888;
            font-size: 14px;
            margin: 0;
        }

        .download-buttons {
            display: flex;
            flex-direction: row;
            gap: 15px;
            margin-bottom: 30px;
            height: 80px;
            justify-content: center;
            align-items: center;
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            background: #DADADA;
            color: black;
            text-decoration: none;
            border-radius: 20px;
            font-weight: 600;
            transition: background 0.3s;
            border: none;
            cursor: pointer;
            font-size: 16px;
            height: 100%;
            width: 50%;
        }

        .download-btn:hover {
            background: white;
            color: black;
        }

        .download-btn>div {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
        }

        .download-btn>div span:first-child {
            font-size: 12px;
            font-weight: 400;
            opacity: 0.7;
        }

        .download-btn>div span:last-child {
            font-size: 16px;
            font-weight: 600;
        }

        .coming-soon {
            border: 2px solid #EEE;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
        }

        .coming-soon h2 {
            color: #EEE;
            margin-top: 0;
        }

        .coming-soon p {
            margin-bottom: 0;
        }

        .badge {
            display: inline-block;
            background: #EEE;
            color: black;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <div class="container">

    <script>
        // Device detection
        function detectDevice() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;

            // iOS detection
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                return 'ios';
            }

            // Android detection
            if (/android/i.test(userAgent)) {
                return 'android';
            }

            return 'other';
        }

        // Get app store links from data attributes or constants
        const APP_STORE_LINK = "https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://apps.apple.com/ca/app/wsh/id6755229275&ved=2ahUKEwi-wOrAqNySAxUL0PACHYiRIAcQFnoECAwQAQ&usg=AOvVaw3Vw4h_Vl2Y0A5B0Tg1EpR8";
        const PLAY_STORE_LINK = "https://play.google.com/store/apps/details?id=com.wsh.weshapp";

        const deviceType = detectDevice();

        if (deviceType === 'ios') {
            // Redirect to App Store
            window.location.href = APP_STORE_LINK;
        } else if (deviceType === 'android') {
            // Redirect to Play Store
            window.location.href = PLAY_STORE_LINK;
        }
        // For 'other', the page with buttons will display
    </script>
