    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA86nJPGQOOTM0U-eHuhqnTi0O9EpdmX0A",
            authDomain: "wesh-3ae30.firebaseapp.com",
            projectId: "wesh-3ae30",
            storageBucket: "wesh-3ae30.firebasestorage.app",
            messagingSenderId: "831826032838",
            appId: "1:831826032838:web:5e1c8fa3054c6ea459bfc7"
        };

        const offenceThresholds = {
            porn: 50,
            extremism: 40,
            csam: 10,  // Very strict - any detection
            weapons: 60,
            gore: 50,
            drugs: 55,
            gestures: 70,
            underwear: 75,
            alcohol: 65,
            gambling: 70,
            genai: 80,
            ID: 60,
            documents: 80,
            qrbarcodes: 90,
            currency: 85,
            face: 95  // Very lenient
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const storage = firebase.storage();
        const storageRef = storage.ref();

        let currentMode = 'url';
        let resultCount = 0;

        function switchMode(mode) {
            currentMode = mode;

            // Update buttons
            document.querySelectorAll('.mode-button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Update content
            document.querySelectorAll('.input-mode-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(mode + '-mode').classList.add('active');
        }

        async function uploadImageToFirebase(file) {
            return new Promise((resolve, reject) => {
                // Create a unique filename
                const timestamp = Date.now();
                const randomString = Math.random().toString(36).substring(7);
                const filename = `${timestamp}_${randomString}_${file.name}`;

                // Upload to under_review folder
                const imageRef = storageRef.child(`under_review/${filename}`);

                // Upload the file
                const uploadTask = imageRef.put(file);

                uploadTask.on('state_changed',
                    (snapshot) => {
                        const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                        console.log('Upload is ' + progress + '% done');
                    },
                    (error) => {
                        console.error('Upload error:', error);
                        reject(error);
                    },
                    async () => {
                        try {
                            const downloadURL = await uploadTask.snapshot.ref.getDownloadURL();
                            console.log('File uploaded to under_review:', downloadURL);
                            // Return both URL and reference for later operations
                            resolve({
                                url: downloadURL,
                                ref: imageRef,
                                filename: filename
                            });
                        } catch (error) {
                            reject(error);
                        }
                    }
                );
            });
        }

        function evaluateAgainstThresholds(data) {
            const violations = [];

            // Check each category against its threshold
            Object.keys(offenceThresholds).forEach(category => {
                const value = parseFloat(data[category]) || 0;
                const threshold = offenceThresholds[category];

                if (value >= threshold) {
                    violations.push({
                        category: category,
                        value: value,
                        threshold: threshold
                    });
                }
            });

            return {
                isFlagged: violations.length > 0,
                violations: violations
            };
        }

        async function moveImageToPassed(sourceRef, filename, originalFile) {
            try {
                console.log('Starting move operation for:', filename);

                // Upload original file to passed folder
                const passedRef = storageRef.child(`passed/${filename}`);
                await passedRef.put(originalFile);
                console.log('Uploaded to passed folder');

                // Delete from under_review
                await deleteImageFromStorage(sourceRef);
                console.log('Deleted from under_review');

            } catch (error) {
                console.error('Error moving image:', error);
                throw error;
            }
        }

        async function deleteImageFromStorage(imageRef) {
            try {
                await imageRef.delete();
                console.log('Image deleted from storage');
            } catch (error) {
                console.error('Error deleting image:', error);
                throw error;
            }
        }

        function getSelectedCategories() {
            const checkboxes = document.querySelectorAll('.checkbox-group input[type="checkbox"]:checked');
            return Array.from(checkboxes).map(cb => cb.value).join(',');
        }

        async function submitImage() {
            const apiKey = document.getElementById('apiKey').value.trim();

            if (!apiKey) {
                alert('Please enter your WebPurify API key');
                return;
            }

            let imageUrls = [];

            if (currentMode === 'url') {
                const urlInput = document.getElementById('imageUrl').value.trim();
                if (!urlInput) {
                    alert('Please enter at least one image URL');
                    return;
                }

                imageUrls = urlInput.split('\n')
                    .map(url => url.trim())
                    .filter(url => url.length > 0);

                if (imageUrls.length === 0) {
                    alert('Please enter at least one valid image URL');
                    return;
                }
            } else {
                // File upload mode
                const fileInput = document.getElementById('imageFile');
                if (!fileInput.files || fileInput.files.length === 0) {
                    alert('Please select at least one image file');
                    return;
                }

                // Disable file input while processing
                fileInput.disabled = true;

                // Upload files to Firebase and get URLs
                for (let i = 0; i < fileInput.files.length; i++) {
                    const file = fileInput.files[i];

                    // Create a temporary result item showing upload progress
                    const resultId = ++resultCount;
                    createResultItem(resultId, URL.createObjectURL(file), 'uploading', ['aim']);

                    try {
                        // Upload to Firebase (under_review folder)
                        const uploadResult = await uploadImageToFirebase(file);

                        // Update the result item with the actual URL
                        const resultItem = document.getElementById(`result-${resultId}`);
                        const imgElement = resultItem.querySelector('.result-image');
                        imgElement.src = uploadResult.url;

                        // Start moderation check with file reference AND original file
                        checkImageWithWebPurify(resultId, uploadResult.url, apiKey, uploadResult.ref, uploadResult.filename, file);

                    } catch (error) {
                        console.error('Upload failed:', error);
                        updateResultItem(resultId, 'error', null, `Upload failed: ${error.message}`, 'aim');
                    }
                }

                // Re-enable file input after all uploads complete
                fileInput.disabled = false;
                return;
            }
        }

        // Extract WebPurify checking logic into separate function
        function checkImageWithWebPurify(resultId, imageUrl, apiKey, imageRef = null, filename = null, originalFile = null) {
            const categories = getSelectedCategories();

            const params = new URLSearchParams({
                api_key: apiKey,
                format: 'json',
                method: 'webpurify.aim.imgcheck',
                cats: categories,
                imgurl: imageUrl
            });


            const directUrl = `https://im-api1.webpurify.com/v2/services/rest/?${params.toString()}`;
            const corsProxy = 'https://corsproxy.io/?';
            const apiUrl = corsProxy + encodeURIComponent(directUrl);

            fetch(apiUrl)
                .then(response => response.json())
                .then(async data => {
                    if (data.rsp && data.rsp['@attributes'] && data.rsp['@attributes'].stat === 'ok') {
                        // Evaluate against thresholds
                        const evaluation = evaluateAgainstThresholds(data.rsp);

                        // Handle file operations if this was an uploaded file
                        if (imageRef && filename && originalFile) {
                            if (evaluation.isFlagged) {
                                // FLAGGED: Delete from storage
                                console.log('Image flagged - deleting from storage');
                                try {
                                    await deleteImageFromStorage(imageRef);
                                    updateResultItem(resultId, 'flagged', data.rsp, evaluation.violations, 'aim');
                                } catch (error) {
                                    console.error('Failed to delete flagged image:', error);
                                    updateResultItem(resultId, 'flagged', data.rsp, evaluation.violations, 'aim');
                                }
                            } else {
                                // PASSED: Upload to passed folder and delete from under_review
                                console.log('Image passed - uploading to passed folder');
                                try {
                                    await moveImageToPassed(imageRef, filename, originalFile);
                                    updateResultItem(resultId, 'approved', data.rsp, null, 'aim');
                                } catch (error) {
                                    console.error('Failed to move approved image:', error);
                                    updateResultItem(resultId, 'approved', data.rsp, null, 'aim');
                                }
                            }
                        } else {
                            // URL mode - just show results with evaluation
                            if (evaluation.isFlagged) {
                                updateResultItem(resultId, 'flagged', data.rsp, evaluation.violations, 'aim');
                            } else {
                                updateResultItem(resultId, 'approved', data.rsp, null, 'aim');
                            }
                        }
                    } else {
                        const error = data.rsp?.err?.['@attributes']?.msg || 'Unknown error occurred';
                        updateResultItem(resultId, 'error', null, error, 'aim');
                    }
                })
                .catch(error => {
                    updateResultItem(resultId, 'error', null, error.message, 'aim');
                });
        }

        function createResultItem(id, imageUrl, status, endpoints) {
            const resultsContainer = document.getElementById('results');

            const resultDiv = document.createElement('div');
            resultDiv.className = 'result-item';
            resultDiv.id = `result-${id}`;

            const endpointBadges = endpoints.map(ep =>
                `<span class="endpoint-badge badge-${ep}">${ep}</span>`
            ).join('');

            const statusText = status === 'uploading' ? 'Uploading...' : 'Checking...';
            const statusClass = status === 'uploading' ? 'status-uploading' : 'status-loading';

            resultDiv.innerHTML = `
        <div class="result-header">
            <img src="${imageUrl}" class="result-image" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22150%22%3E%3Crect fill=%22%23333%22 width=%22100%22 height=%22150%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23AAA%22 font-size=%2212%22%3EError%3C/text%3E%3C/svg%3E'">
            <div class="result-info">
                <span class="result-status ${statusClass}">
                    ${statusText}${endpointBadges}
                </span>
            </div>
        </div>
        <div class="result-data" id="result-data-${id}">
            ${endpoints.includes('aim') ? '<div id="aim-results-' + id + '"></div>' : ''}
        </div>
    `;

            resultsContainer.insertBefore(resultDiv, resultsContainer.firstChild);
        }

        function updateResultItem(id, status, data, errorOrViolations, endpoint) {
            const resultItem = document.getElementById(`result-${id}`);
            const statusSpan = resultItem.querySelector('.result-status');
            const aimDiv = document.getElementById(`aim-results-${id}`);

            if (status === 'approved') {
                statusSpan.className = 'result-status status-approved';
                statusSpan.textContent = '✓ Approved';

                let html = '<div class="approval-badge badge-approved">✓ PASSED - Moved to /passed folder</div>';
                html += '<div class="score-grid" style="margin-top: 12px;">';

                const categories = [
                    { key: 'porn', label: 'Porn' },
                    { key: 'extremism', label: 'Extremism' },
                    { key: 'csam', label: 'CSAM' },
                    { key: 'weapons', label: 'Weapons' },
                    { key: 'gore', label: 'Gore' },
                    { key: 'drugs', label: 'Drugs' },
                    { key: 'gestures', label: 'Gestures' },
                    { key: 'underwear', label: 'Underwear' },
                    { key: 'alcohol', label: 'Alcohol' },
                    { key: 'gambling', label: 'Gambling' },
                    { key: 'genai', label: 'Gen AI' },
                    { key: 'ID', label: 'ID Cards' },
                    { key: 'documents', label: 'Documents' },
                    { key: 'qrbarcodes', label: 'QR/Barcodes' },
                    { key: 'currency', label: 'Currency' },
                    { key: 'face', label: 'Face Detection' }
                ];

                categories.forEach(cat => {
                    if (data[cat.key] !== undefined && data[cat.key] > 0) {
                        html += createScoreItem(cat.label, data[cat.key]);
                    }
                });

                html += '</div>';

                if (data.ocr_text) {
                    html += `
                <div class="ocr-section">
                    <div class="ocr-label">OCR Detected Text:</div>
                    <div class="ocr-text">${escapeHtml(data.ocr_text)}</div>
                    ${data.ocr_profanity === '1' ? `
                        <div class="ocr-text" style="color: #f87171; margin-top: 8px;">
                            ⚠️ Profanity: ${escapeHtml(data.ocr_profanity_words || 'N/A')}
                        </div>
                    ` : ''}
                </div>
            `;
                }

                aimDiv.innerHTML = html;

            } else if (status === 'flagged') {
                statusSpan.className = 'result-status status-flagged';
                statusSpan.textContent = '✗ Flagged';

                let html = '<div class="approval-badge badge-flagged">✗ FLAGGED - Deleted from storage</div>';

                // Show violations
                if (errorOrViolations && errorOrViolations.length > 0) {
                    html += '<div class="violation-list">';
                    html += '<div style="font-weight: 600; margin-bottom: 4px;">Threshold Violations:</div>';
                    errorOrViolations.forEach(v => {
                        html += `<div class="violation-item">• ${v.category}: ${v.value}% (threshold: ${v.threshold}%)</div>`;
                    });
                    html += '</div>';
                }

                html += '<div class="score-grid" style="margin-top: 12px;">';

                const categories = [
                    { key: 'porn', label: 'Porn' },
                    { key: 'extremism', label: 'Extremism' },
                    { key: 'csam', label: 'CSAM' },
                    { key: 'weapons', label: 'Weapons' },
                    { key: 'gore', label: 'Gore' },
                    { key: 'drugs', label: 'Drugs' },
                    { key: 'gestures', label: 'Gestures' },
                    { key: 'underwear', label: 'Underwear' },
                    { key: 'alcohol', label: 'Alcohol' },
                    { key: 'gambling', label: 'Gambling' },
                    { key: 'genai', label: 'Gen AI' },
                    { key: 'ID', label: 'ID Cards' },
                    { key: 'documents', label: 'Documents' },
                    { key: 'qrbarcodes', label: 'QR/Barcodes' },
                    { key: 'currency', label: 'Currency' },
                    { key: 'face', label: 'Face Detection' }
                ];

                categories.forEach(cat => {
                    if (data[cat.key] !== undefined && data[cat.key] > 0) {
                        html += createScoreItem(cat.label, data[cat.key]);
                    }
                });

                html += '</div>';

                aimDiv.innerHTML = html;

            } else if (status === 'success') {
                // Legacy success (no approval/flagged logic)
                statusSpan.className = 'result-status status-success';
                statusSpan.textContent = 'Complete';
                statusSpan.hidden = true;

                let html = '<div class="score-grid">';

                const categories = [
                    { key: 'porn', label: 'Porn' },
                    { key: 'extremism', label: 'Extremism' },
                    { key: 'csam', label: 'CSAM' },
                    { key: 'weapons', label: 'Weapons' },
                    { key: 'gore', label: 'Gore' },
                    { key: 'drugs', label: 'Drugs' },
                    { key: 'gestures', label: 'Gestures' },
                    { key: 'underwear', label: 'Underwear' },
                    { key: 'alcohol', label: 'Alcohol' },
                    { key: 'gambling', label: 'Gambling' },
                    { key: 'genai', label: 'Gen AI' },
                    { key: 'ID', label: 'ID Cards' },
                    { key: 'documents', label: 'Documents' },
                    { key: 'qrbarcodes', label: 'QR/Barcodes' },
                    { key: 'currency', label: 'Currency' },
                    { key: 'face', label: 'Face Detection' }
                ];

                categories.forEach(cat => {
                    if (data[cat.key] !== undefined && data[cat.key] > 10) {
                        html += createScoreItem(cat.label, data[cat.key]);
                    }
                });

                html += '</div>';

                if (data.ocr_text) {
                    html += `
                <div class="ocr-section">
                    <div class="ocr-label">OCR Detected Text:</div>
                    <div class="ocr-text">${escapeHtml(data.ocr_text)}</div>
                    ${data.ocr_profanity === '1' ? `
                        <div class="ocr-text" style="color: #f87171; margin-top: 8px;">
                            ⚠️ Profanity: ${escapeHtml(data.ocr_profanity_words || 'N/A')}
                        </div>
                    ` : ''}
                </div>
            `;
                }

                aimDiv.innerHTML = html;

            } else if (status === 'error') {
                statusSpan.className = 'result-status status-error';
                statusSpan.textContent = 'Error';
                aimDiv.innerHTML = `<div class="error-message">Error: ${escapeHtml(errorOrViolations)}</div>`;
            }
        }

        function createScoreItem(label, value) {
            const numValue = parseFloat(value);

            // Only show if value > 0
            if (numValue <= 0) {
                return '';
            }

            let chipClass = 'chip-low';
            let scoreClass = 'score-low';

            if (numValue > 50) {
                chipClass = 'chip-high';
                scoreClass = 'score-high';
            } else if (numValue > 20) {
                chipClass = 'chip-medium';
                scoreClass = 'score-medium';
            }

            return `
        <div class="score-item ${chipClass}">
            <span class="score-label">${label}</span>
            <span class="score-value ${scoreClass}">${value}%</span>
        </div>
    `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        window.addEventListener('DOMContentLoaded', function () {
            // Test result 1: Multiple detections
            const testId1 = ++resultCount;
            createResultItem(testId1, 'assets/wsh-white.png', 'loading', ['aim']);

            const testData1 = {
                porn: 85,
                gore: 25,
                weapons: 15,

            };
            updateResultItem(testId1, 'success', testData1, null, 'aim');

            // Test result 2: Different detections
            const testId2 = ++resultCount;
            createResultItem(testId2, 'assets/wsh-white.png', 'loading', ['aim']);

            const testData2 = {
                drugs: 65,
                underwear: 45
            };
            updateResultItem(testId2, 'success', testData2, null, 'aim');
        });
    </script>
